<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הסדר שלי</title>
<meta name="theme-color" content="#0E0B1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="הסדר שלי">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
@font-face{font-family:Heebo;font-weight:400;font-display:swap;src:url(h400.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Heebo;font-weight:500;font-display:swap;src:url(h500.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Heebo;font-weight:700;font-display:swap;src:url(h700.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Heebo;font-weight:800;font-display:swap;src:url(h800.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Heebo;font-weight:400;font-display:swap;src:url(l400.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
@font-face{font-family:Heebo;font-weight:500;font-display:swap;src:url(l500.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
@font-face{font-family:Heebo;font-weight:700 800;font-display:swap;src:url(l700.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC}

:root{
  --bg:#0E0B1F;--bg2:#15112C;--sf:rgba(255,255,255,.055);--sf2:rgba(255,255,255,.09);--ln:rgba(255,255,255,.09);
  --ink:#F4F1FF;--mu:#A39DC6;--ac:#9277FF;--acs:rgba(146,119,255,.18);--hot:#FF7A8A;--gold:#FFC56B;--ok:#5FE0B0;
  --glow1:rgba(120,80,255,.35);--glow2:rgba(255,110,140,.18);--field:rgba(255,255,255,.06);
  --hero:linear-gradient(135deg,#5A3BFF 0%,#9A5BFF 55%,#FF7A8A 120%);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F7F4EF;--bg2:#EFEAF8;--sf:#FFFFFF;--sf2:#F3F0FA;--ln:rgba(27,23,48,.08);
  --ink:#1B1730;--mu:#6E6890;--ac:#6A44FF;--acs:rgba(106,68,255,.11);--hot:#E2456A;--gold:#C98712;--ok:#16946A;
  --glow1:rgba(130,100,255,.18);--glow2:rgba(255,140,150,.16);--field:#F5F2FB;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:Heebo,-apple-system,system-ui,Arial,sans-serif;font-size:16px;line-height:1.5;min-height:100vh;
  background:radial-gradient(60vmax 50vmax at 100% -10%,var(--glow1),transparent 60%),radial-gradient(50vmax 40vmax at -10% 10%,var(--glow2),transparent 60%),var(--bg);background-attachment:fixed}
main{max-width:620px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(120px + env(safe-area-inset-bottom,0px))}
h1{font-size:2.15rem;font-weight:800;line-height:1.1;margin:10px 0 4px;letter-spacing:-.6px}
.sub{color:var(--mu);margin:0 0 18px;font-size:.98rem}
h2{font-size:.82rem;font-weight:700;margin:26px 4px 10px;color:var(--mu);letter-spacing:.4px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:4px 16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
ul{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border-bottom:0}
.tx{flex:1;min-width:0;word-break:break-word}
.tx small{display:block;color:var(--mu);font-size:.8rem}
.time{font-weight:700;color:var(--ac);font-size:.92rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.late .time{color:var(--hot)}
.done .tx{text-decoration:line-through;color:var(--mu)}
.tag{font-size:.74rem;background:var(--acs);color:var(--ac);padding:3px 10px;border-radius:99px;font-weight:500;white-space:nowrap}
.ib{border:0;background:none;color:var(--mu);font:inherit;cursor:pointer;min-width:34px;min-height:34px;border-radius:12px;display:grid;place-items:center;font-size:1.05rem}
.ib:active{background:var(--sf2)}
.ib.x{font-size:1.35rem}
.ck{width:26px;height:26px;min-width:26px;border:2px solid var(--ac);border-radius:9px;background:none;padding:0;color:#fff;cursor:pointer;display:grid;place-items:center;font-size:.9rem;transition:transform .15s}
.ck:active{transform:scale(.85)}
.done .ck{background:var(--ac)}
.add{display:flex;flex-wrap:wrap;gap:8px;background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.add input,.add select,.add textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;min-height:46px;min-width:0}
.add input[type=text],.add textarea,.add .full{flex:1 1 100%}
.add textarea{min-height:90px;resize:vertical}
.add input:not([type=text]),.add select{flex:1 1 120px}
.go{font:inherit;font-weight:700;background:var(--ac);color:#fff;border:0;border-radius:14px;padding:11px 20px;min-height:46px;cursor:pointer;flex:1 1 100%;box-shadow:0 8px 24px -10px var(--ac)}
.go.soft{background:var(--acs);color:var(--ac);box-shadow:none}
.go:active{transform:scale(.98)}
.empty{color:var(--mu);padding:18px 0;text-align:center;font-size:.95rem}
.dh{font-weight:700;color:var(--mu);font-size:.85rem;margin:20px 6px 8px}
.hero{background:var(--hero);border-radius:26px;padding:20px;color:#fff;position:relative;overflow:hidden;box-shadow:0 18px 40px -18px rgba(110,70,255,.7)}
.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;left:-50px;top:-60px;background:rgba(255,255,255,.12)}
.hero .lb{font-size:.8rem;opacity:.85;font-weight:500}
.hero .big{font-size:1.35rem;font-weight:800;margin:4px 0 2px;position:relative}
.hero .when{opacity:.9;font-size:.95rem}
.chips{display:flex;gap:10px;margin-top:12px}
.chip{flex:1;background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:12px 14px;cursor:pointer;text-align:start;font:inherit;color:inherit}
.chip b{display:block;font-size:1.5rem;font-weight:800;line-height:1.2}
.chip span{color:var(--mu);font-size:.8rem}
.stats{display:flex;gap:10px;margin-bottom:12px}
.stat{flex:1;background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:14px}
.stat b{display:block;font-size:1.4rem;font-weight:800}.stat span{color:var(--mu);font-size:.82rem}
.bar{height:10px;background:var(--acs);border-radius:99px;overflow:hidden;margin:6px 0 4px}.bar i{display:block;height:100%;background:var(--hero)}
.note{color:var(--mu);font-size:.84rem;margin:8px 6px}
.seg{display:flex;gap:6px;flex:1 1 100%}
.seg button{flex:1;font:inherit;font-size:.88rem;border:1px solid var(--ln);background:var(--field);color:var(--mu);border-radius:12px;min-height:40px;cursor:pointer}
.seg button.on{background:var(--acs);color:var(--ac);border-color:transparent;font-weight:700}
.menu .row{cursor:pointer}
.menu .row .ic{font-size:1.3rem;width:38px;height:38px;display:grid;place-items:center;background:var(--acs);border-radius:12px}
.menu .chev{color:var(--mu)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(600px,calc(100% - 20px));background:rgba(22,18,44,.78);border:1px solid var(--ln);border-radius:26px;display:flex;padding:6px;backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 14px 40px -12px rgba(0,0,0,.55);z-index:5}
:root[data-theme="light"] nav{background:rgba(255,255,255,.82)}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--mu);font:inherit;font-size:.66rem;padding:6px 0;border-radius:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:50px;position:relative}
nav button span{font-size:1.25rem;line-height:1.2}
nav button.on{color:var(--ink);background:var(--acs);font-weight:700}
nav .dot{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--hot);color:#fff;font-size:.65rem;font-weight:700;display:grid;place-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));width:min(560px,calc(100% - 24px));background:var(--bg2);border:1px solid var(--ln);border-radius:22px;padding:14px 16px;z-index:20;box-shadow:0 20px 50px -15px rgba(0,0,0,.6);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toast .t{flex:1 1 100%;font-weight:700}
.toast .t small{display:block;color:var(--mu);font-weight:400}
.toast button{flex:1;font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:12px;min-height:40px;cursor:pointer;background:var(--acs);color:var(--ac)}
.toast button.p{background:var(--ac);color:#fff}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.9rem;font-weight:500;z-index:30;white-space:nowrap}
.tip{background:var(--sf);border:1px dashed var(--ln);border-radius:20px;padding:14px 16px;color:var(--mu);font-size:.9rem;margin-top:14px}
.tip b{color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.card,.add,.hero,.chips{animation:in .28s ease-out both}.toast{animation:drop .3s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}}@keyframes drop{from{opacity:0;transform:translate(-50%,-14px)}}}
</style>
</head>
<body>
<main><div id="v"></div></main>
<nav id="nav" aria-label="ניווט"></nav>
<div id="toast"></div>
<script>
var KEY='seder';
var BASE={ev:[],tk:[],id:[],rm:[],inc:[],fu:{st:'שוקל',notes:'',q:{1:true,2:true,3:true,7:true}},cap:'',theme:'dark',name:''};
var S=JSON.parse(JSON.stringify(BASE)),tab='today';
var TABS=[['today','☀️','היום'],['ev','📅','לוז'],['tk','✅','משימות'],['id','💡','רעיונות'],['rm','🔔','תזכורות'],['more','✨','עוד']];
var SUB={inc:1,fu:1,set:1,op:1};
var pad=function(n){return String(n).padStart(2,'0')};
var dstr=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var lstr=function(d){return dstr(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
var today=function(){return dstr(new Date())};
var nowL=function(){return lstr(new Date())};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var fd=function(s){return new Date(s+'T00:00').toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'})};
var fdt=function(s){var d=new Date(s);return d.toLocaleDateString('he-IL',{weekday:'short',day:'numeric',month:'numeric'})+' · '+pad(d.getHours())+':'+pad(d.getMinutes())};
var $=function(s){return document.querySelector(s)};
var REP={'':'פעם אחת',d:'כל יום',w:'כל שבוע',m:'כל חודש'};

function load(){try{var l=JSON.parse(localStorage.getItem(KEY));if(l)S=Object.assign(JSON.parse(JSON.stringify(BASE)),l)}catch(e){}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){flash('לא הצלחתי לשמור במכשיר')}}
function save(){persist();render();badge()}
function flash(t){var f=document.createElement('div');f.className='flash';f.textContent=t;document.body.appendChild(f);setTimeout(function(){f.remove()},2200)}
function theme(){document.documentElement.dataset.theme=S.theme==='light'?'light':'dark';var m=document.querySelector('meta[name=theme-color]');if(m)m.content=S.theme==='light'?'#F7F4EF':'#0E0B1F'}

/* ---------- reminders ---------- */
function nextOcc(at,rep){var d=new Date(at);if(rep==='d')d.setDate(d.getDate()+1);else if(rep==='w')d.setDate(d.getDate()+7);else if(rep==='m')d.setMonth(d.getMonth()+1);return lstr(d)}
function dueList(){var n=nowL();return S.rm.filter(function(r){return !r.d&&r.at<=n})}
function badge(){var c=dueList().length;try{if(navigator.setAppBadge){c?navigator.setAppBadge(c):navigator.clearAppBadge()}}catch(e){}var d=document.querySelector('[data-k=rm] .dot');if(d)d.textContent=c||'';}
function notify(r){
  try{if('Notification' in window&&Notification.permission==='granted'&&navigator.serviceWorker){navigator.serviceWorker.ready.then(function(reg){reg.showNotification('תזכורת',{body:r.t,icon:'icon-192.png',badge:'icon-192.png',tag:r.i})})}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(e){}
}
var shown=null;
function check(){
  var due=dueList().filter(function(r){return !r.n});
  due.forEach(function(r){r.n=1;notify(r)});
  if(due.length)persist();
  var open=dueList();
  if(open.length&&!shown){showToast(open[0])}
  badge();
}
function showToast(r){
  shown=r.i;
  $('#toast').innerHTML='<div class="toast" role="alert"><div class="t">🔔 '+esc(r.t)+'<small>'+fdt(r.at)+(r.rep?' · '+REP[r.rep]:'')+'</small></div><button class="p" data-a="tdone" data-id="'+r.i+'">בוצע</button><button data-a="snooze" data-id="'+r.i+'">עוד 10 דק׳</button><button data-a="snooze" data-m="60" data-id="'+r.i+'">עוד שעה</button></div>';
}
function hideToast(){shown=null;$('#toast').innerHTML='';setTimeout(check,400)}
function completeRm(id){S.rm.forEach(function(r){if(r.i!==id)return;if(r.rep&&!r.d){var n=r.at,now=nowL();do{n=nextOcc(n,r.rep)}while(n<=now);r.at=n;r.n=0;flash('הבאה: '+fdt(n))}else{r.d=!r.d;r.n=1}})}

/* ---------- calendar (.ics) ---------- */
function icsDate(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00'}
function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/[,;]/g,function(c){return '\\'+c}).replace(/\n/g,'\\n')}
function ics(title,start,allDay,rep,alarmMin){
  var s=new Date(start),e=new Date(s.getTime()+(allDay?864e5:36e5)),L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//seder//he','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+uid()+'@seder','DTSTAMP:'+icsDate(new Date())];
  if(allDay){L.push('DTSTART;VALUE=DATE:'+icsDate(s).slice(0,8),'DTEND;VALUE=DATE:'+icsDate(e).slice(0,8))}
  else{L.push('DTSTART:'+icsDate(s),'DTEND:'+icsDate(e))}
  L.push('SUMMARY:'+icsEsc(title));
  if(rep)L.push('RRULE:FREQ='+{d:'DAILY',w:'WEEKLY',m:'MONTHLY'}[rep]);
  L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'TRIGGER:-PT'+(alarmMin||0)+'M','END:VALARM','END:VEVENT','END:VCALENDAR');
  return L.join('\r\n');
}
function giveFile(name,text,type){
  var blob=new Blob([text],{type:type});
  try{var f=new File([blob],name,{type:type});if(navigator.canShare&&navigator.canShare({files:[f]})&&/iPhone|iPad|Android/i.test(navigator.userAgent)){navigator.share({files:[f]}).catch(function(){dl(blob,name)});return}}catch(e){}
  dl(blob,name);
}
function dl(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000)}

/* ---------- rows ---------- */
function del(k,id){S[k]=S[k].filter(function(x){return x.i!==id});save()}
function empty(t){return '<div class="empty">'+t+'</div>'}
function xb(k,id){return '<button class="ib x" aria-label="מחיקה" data-a="del" data-k="'+k+'" data-id="'+id+'">×</button>'}
function cb(k,id){return '<button class="ib" aria-label="הוספה ליומן של הטלפון" title="ליומן של הטלפון" data-a="cal" data-k="'+k+'" data-id="'+id+'">📲</button>'}
function evRow(e){return '<li class="row"><span class="time">'+(e.tm||'כל היום')+'</span><span class="tx">'+esc(e.t)+'</span>'+cb('ev',e.i)+xb('ev',e.i)+'</li>'}
function tkRow(t){return '<li class="row'+(t.d?' done':'')+'"><button class="ck" aria-label="סימון" data-a="tog" data-k="tk" data-id="'+t.i+'">'+(t.d?'✓':'')+'</button><span class="tx">'+esc(t.t)+'</span><span class="tag">'+esc(t.g)+'</span>'+xb('tk',t.i)+'</li>'}
function rmRow(r){var late=!r.d&&r.at<=nowL();
  return '<li class="row'+(r.d?' done':'')+(late?' late':'')+'"><button class="ck" aria-label="סימון" data-a="rmtog" data-id="'+r.i+'">'+(r.d?'✓':'')+'</button><span class="tx">'+esc(r.t)+'<small class="time" style="color:inherit;opacity:.85">'+fdt(r.at)+(r.rep?' · 🔁 '+REP[r.rep]:'')+'</small></span>'+cb('rm',r.i)+xb('rm',r.i)+'</li>'}
function card(rows,msg){return '<div class="card">'+(rows.length?'<ul>'+rows.join('')+'</ul>':empty(msg))+'</div>'}
function byTime(a,b){return (a.dt+(a.tm||'')).localeCompare(b.dt+(b.tm||''))}

/* ---------- views ---------- */
function vToday(){
  var h=new Date().getHours(),g=h<5?'לילה טוב':h<12?'בוקר טוב':h<17?'צהריים טובים':h<21?'ערב טוב':'לילה טוב',t=today(),n=nowL();
  var ev=S.ev.filter(function(e){return e.dt===t}).sort(byTime);
  var rmToday=S.rm.filter(function(r){return !r.d&&r.at.slice(0,10)<=t}).sort(function(a,b){return a.at.localeCompare(b.at)});
  var open=S.tk.filter(function(x){return !x.d});
  // next thing
  var cand=[];
  S.ev.forEach(function(e){var k=e.dt+'T'+(e.tm||'00:00');if(e.dt>t||(e.dt===t&&(!e.tm||k>=n)))cand.push({k:k,t:e.t,w:e.dt===t?(e.tm?'היום ב־'+e.tm:'היום'):fd(e.dt)+(e.tm?' · '+e.tm:''),lb:'הדבר הבא בלוז'})});
  S.rm.forEach(function(r){if(!r.d&&r.at>=n)cand.push({k:r.at,t:r.t,w:fdt(r.at),lb:'התזכורת הבאה'})});
  cand.sort(function(a,b){return a.k.localeCompare(b.k)});
  var nx=cand[0];
  var hero='<div class="hero"><div class="lb">'+(nx?nx.lb:'הכול פנוי')+'</div><div class="big">'+(nx?esc(nx.t):'אין משהו קרוב בלוז')+'</div><div class="when">'+(nx?esc(nx.w):'זמן טוב ליצור משהו')+'</div></div>';
  return '<h1>'+g+(S.name?', '+esc(S.name):'')+'</h1><p class="sub">'+fd(t)+'</p>'+hero+
  '<div class="chips"><button class="chip" data-a="tab" data-k="ev"><b>'+ev.length+'</b><span>אירועים היום</span></button><button class="chip" data-a="tab" data-k="rm"><b>'+rmToday.length+'</b><span>תזכורות להיום</span></button><button class="chip" data-a="tab" data-k="tk"><b>'+open.length+'</b><span>משימות פתוחות</span></button></div>'+

  else if(a==='addInc'){var t5=val('a1'),am=parseFloat(val('a2')),d5=val('a3');if(!t5||!(am>0)||!d5)return flash('חסר תיאור או סכום');S.inc.unshift({i:uid(),t:t5,a:am,dt:d5,g:val('a4')});save()}
  else if(a==='opq'){if(!S.op)S.op={q:{}};S.op.q[id]=!S.op.q[id];save()}
  else if(a==='opRm'){var d0=new Date();if(k==='bl'){d0.setDate(d0.getDate()+7);d0.setHours(10,0,0,0);S.rm.push({i:uid(),t:'לבדוק באזור האישי בביטוח לאומי שנפתח תיק עצמאי',at:lstr(d0),rep:'',d:false})}else{var y=d0.getMonth()===0&&d0.getDate()<25?d0.getFullYear():d0.getFullYear()+1;S.rm.push({i:uid(),t:'להגיש למע״מ הצהרה שנתית על המחזור של שנה שעברה',at:y+'-01-20T10:00',rep:'',d:false})}save();flash('התזכורת נוספה ✓')}
  else if(a==='fq'){S.fu.q[id]=!S.fu.q[id];save()}
  else if(a==='clearDone'){S.tk=S.tk.filter(function(x){return !x.d});save()}
  else if(a==='cal'){var it=S[k].filter(function(x){return x.i===id})[0];if(!it)return;
    if(k==='ev')giveFile('event.ics',ics(it.t,it.dt+'T'+(it.tm||'09:00'),!it.tm,'',it.tm?15:0),'text/calendar');
    else giveFile('reminder.ics',ics(it.t,it.at,false,it.rep,0),'text/calendar')}
  else if(a==='tdone'){completeRm(id);persist();render();hideToast()}
  else if(a==='snooze'){var m=parseInt(b.dataset.m||'10',10);S.rm.forEach(function(r){if(r.i===id){r.at=lstr(new Date(Date.now()+m*6e4));r.n=0}});persist();render();hideToast();flash('אזכיר שוב בעוד '+(m===60?'שעה':m+' דקות'))}
  else if(a==='perm'){try{Notification.requestPermission().then(function(){render()})}catch(e){}}
  else if(a==='theme'){S.theme=k;theme();save()}
  else if(a==='export'){giveFile('seder-backup-'+today()+'.json',JSON.stringify(S),'application/json')}
  else if(a==='copy'){try{navigator.clipboard.writeText(JSON.stringify(S)).then(function(){flash('הועתק ✓')},function(){flash('ההעתקה לא עבדה')})}catch(e){flash('ההעתקה לא עבדה')}}
  else if(a==='paste'){var p=val('pst');if(p)restore(p)}
});
